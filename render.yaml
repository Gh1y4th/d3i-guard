services:
  - type: web
    name: qr-url-guard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qr-url-guard-db
          property: connectionString
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.11.1

databases:
  - name: qr-url-guard-db
    plan: free
