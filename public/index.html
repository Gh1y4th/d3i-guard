<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR URL Guard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🔍 QR URL Guard</h1>
      <p class="sub">Check a scanned URL for phishing reputation, TLS health, redirect cloaking, domain age, and brand impersonation before anyone opens it.</p>
    </header>

    <section class="scan-box">
      <form id="scan-form">
        <input id="url-input" type="text" placeholder="https://example.com/suspicious-link" required />
        <label class="deep-toggle">
          <input type="checkbox" id="deep-toggle" checked />
          Deep page analysis (screenshot + credential-harvest check)
        </label>
        <button type="submit" id="scan-btn">Scan URL</button>
      </form>
      <div id="scan-status"></div>
    </section>

    <section id="result-panel" class="hidden"></section>

    <section class="history-box">
      <h2>Scan History</h2>
      <table id="history-table">
        <thead>
          <tr><th>Time</th><th>URL</th><th>Verdict</th><th>Score</th></tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </section>
  </div>

  <script>
    // Set this to your deployed Render API URL before deploying to Netlify, e.g.:
    // window.QR_GUARD_API_BASE = "https://qr-url-guard.onrender.com";
    window.QR_GUARD_API_BASE = "";
  </script>
  <script src="app.js"></script>
</body>
</html>
